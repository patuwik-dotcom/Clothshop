<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple E-commerce Catalog</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background-color: #f5f7fa; }

    .navbar { background: linear-gradient(45deg, #0d6efd, #6610f2); }
    .navbar-brand { color: #fff !important; font-weight: bold; }

    .card { border: none; border-radius: 15px; transition: 0.2s; }
    .card:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

    .card img { height: 200px; object-fit: cover; border-radius: 15px 15px 0 0; }

    .price { font-weight: bold; color: #198754; }

    .overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); display: none;
      justify-content: center; align-items: center;
    }

    .overlay-content {
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      text-align: center;
    }

    #modalImage {
      max-height: 300px;
      object-fit: contain;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="#">MyShop</a>

    <div class="d-flex gap-2">
      <input type="text" id="searchInput" class="form-control" placeholder="Search..." onkeyup="renderProducts()">

      <select id="sortSelect" class="form-select" onchange="renderProducts()">
        <option value="default">Sort</option>
        <option value="asc">A - Z</option>
        <option value="desc">Z - A</option>
      </select>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <h2 class="text-center mb-4 text-primary">Product Catalog</h2>
  <div class="row" id="productList"></div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-content">
    <h4 id="modalTitle"></h4>
    <img id="modalImage" class="img-fluid mb-3" />
    <h5 id="modalPrice" class="price"></h5>
    <p id="modalDesc"></p>
    <button class="btn btn-danger" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
  function getRandomPrice() {
    return Math.floor(Math.random() * (200 - 100 + 1)) + 100; // ₱200 - ₱1500
  }

  const products = [
    { title: "Cloth 1", image: "1.jpg", description: "Soft cotton fabric, breathable, lightweight, perfect for daily wear." },
    { title: "Cloth 2", image: "2.jpg", description: "Durable denim material, classic style, suitable for layering." },
    { title: "Cloth 3", image: "3.jpg", description: "Warm fleece interior, comfortable fit, ideal for cool weather." },
    { title: "Cloth 4", image: "4.jpg", description: "Smooth knit fabric, breathable, perfect for semi-casual occasions." },
    { title: "Cloth 5", image: "5.jpg", description: "Lightweight linen material, airy feel, great for hot climates." },
    { title: "Cloth 6", image: "6.jpg", description: "Stretchable fabric, relaxed fit, designed for comfort." },
    { title: "Cloth 7", image: "7.jpg", description: "Fine woven fabric, structured fit, suitable for formal settings." },
    { title: "Cloth 8", image: "8.jpg", description: "Multiple pockets, durable stitching, ideal for utility wear." },
    { title: "Cloth 9", image: "9.jpg", description: "Soft knit texture, warm and cozy, perfect for colder days." },
    { title: "Cloth 10", image: "10.jpg", description: "Breathable material, flexible design, ideal for sports." },
    { title: "Cloth 11", image: "11.jpg", description: "Soft brushed fabric, comfortable fit, great for layering." },
    { title: "Cloth 12", image: "12.jpg", description: "Lightweight twill fabric, slim fit, versatile wear." },
    { title: "Cloth 13", image: "13.jpg", description: "Sleeveless design, soft cotton, ideal for warm weather." },
    { title: "Cloth 14", image: "14.jpg", description: "Smooth outer fabric, easy zip closure, practical." },
    { title: "Cloth 15", image: "15.jpg", description: "Loose fit, breathable cotton, modern style." },
    { title: "Cloth 16", image: "16.jpg", description: "Elastic waistband, smooth fabric, active comfort." },
    { title: "Cloth 17", image: "17.jpg", description: "Soft fabric, full sleeve coverage, casual wear." }
  ].map(p => ({ ...p, price: getRandomPrice() }));

  function renderProducts() {
    const search = document.getElementById("searchInput").value.toLowerCase();
    const sort = document.getElementById("sortSelect").value;

    let filtered = products.filter(p => p.title.toLowerCase().includes(search));

    if (sort === "asc") filtered.sort((a,b) => a.title.localeCompare(b.title));
    if (sort === "desc") filtered.sort((a,b) => b.title.localeCompare(a.title));

    const productList = document.getElementById("productList");
    productList.innerHTML = "";

    filtered.forEach((product) => {
      productList.innerHTML += `
        <div class="col-md-4 mb-4">
          <div class="card" onclick="openModal(${products.indexOf(product)})" style="cursor:pointer">
            <img src="${product.image}" class="card-img-top">
            <div class="card-body">
              <h5 class="card-title">${product.title}</h5>
              <p class="price">₱${product.price}</p>
              <p class="card-text text-muted">Click to view details</p>
            </div>
          </div>
        </div>
      `;
    });
  }

  function openModal(index) {
    document.getElementById("modalTitle").innerText = products[index].title;
    document.getElementById("modalImage").src = products[index].image;
    document.getElementById("modalDesc").innerText = products[index].description;
    document.getElementById("modalPrice").innerText = "₱" + products[index].price;
    document.getElementById("overlay").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("overlay").style.display = "none";
  }

  renderProducts();
</script>

</body>
</html>
