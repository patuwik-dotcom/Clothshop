<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | Andrea Studio</title>
  <style>
    :root {
      --ink: #1f2933;
      --muted: #667085;
      --line: #e4e7ec;
      --paper: #ffffff;
      --soft: #f6f7f9;
      --charcoal: #263238;
      --rose: #b56f62;
      --shadow: 0 18px 45px rgba(31, 41, 51, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--soft);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .shell {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .nav {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      color: var(--charcoal);
      text-decoration: none;
      font-size: 1.15rem;
      font-weight: 800;
    }

    .brand span {
      color: var(--rose);
    }

    .button,
    .solid-button,
    .line-button {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      padding: 0 14px;
      text-decoration: none;
      font-weight: 800;
    }

    .button,
    .solid-button {
      border: 1px solid var(--charcoal);
      background: var(--charcoal);
      color: #fff;
    }

    .line-button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--charcoal);
    }

    .hero {
      padding: 42px 0 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.6rem);
      line-height: 1;
    }

    .copy {
      max-width: 620px;
      margin: 12px 0 0;
      color: var(--muted);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 20px;
      align-items: start;
      padding-bottom: 44px;
    }

    .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(31, 41, 51, 0.07);
      overflow: hidden;
    }

    .panel-head {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 1.1rem;
    }

    .cart-list {
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .cart-item:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .cart-thumb {
      width: 96px;
      height: 108px;
      object-fit: cover;
      border-radius: 8px;
      background: #e5e7eb;
    }

    .cart-item h3 {
      margin: 0;
      font-size: 1.04rem;
    }

    .cart-item p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .cart-row {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .qty {
      display: inline-grid;
      grid-template-columns: 32px 38px 32px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      background: #fff;
    }

    .qty button {
      width: 32px;
      height: 32px;
      border: 0;
      background: #fff;
      color: var(--ink);
      font-weight: 900;
    }

    .qty span {
      text-align: center;
      font-size: 0.9rem;
      font-weight: 800;
    }

    .remove {
      border: 0;
      background: transparent;
      color: var(--rose);
      font-weight: 800;
      padding: 0;
    }

    .summary {
      position: sticky;
      top: 18px;
      padding: 18px;
      display: grid;
      gap: 12px;
    }

    .summary h2 {
      margin: 0 0 4px;
      font-size: 1.1rem;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
    }

    .summary-line strong {
      color: var(--ink);
    }

    .grand-total {
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: 1.16rem;
    }

    .empty {
      padding: 30px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #fbfcfd;
    }

    @media (max-width: 780px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .nav {
        align-items: stretch;
        flex-direction: column;
        padding: 14px 0;
      }

      .cart-item {
        grid-template-columns: 78px 1fr;
      }

      .cart-thumb {
        width: 78px;
        height: 92px;
      }

      .summary {
        position: static;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="shell nav">
      <a class="brand" href="index.html">Andrea <span>Studio</span></a>
      <a class="button" href="index.html#checkout">Continue to Order</a>
    </div>
  </header>

  <main>
    <section class="shell hero">
      <h1>Your Cart</h1>
      <p class="copy">Review quantities, remove pieces, then return to checkout to complete the order details.</p>
    </section>

    <section class="shell layout">
      <div class="panel">
        <div class="panel-head">
          <h2>Selected Items</h2>
          <strong id="itemCount">0 items</strong>
        </div>
        <div class="cart-list" id="cartList"></div>
      </div>

      <aside class="panel summary">
        <h2>Order Summary</h2>
        <div class="summary-line">
          <span>Subtotal</span>
          <strong id="subtotal">PHP 0</strong>
        </div>
        <div class="summary-line">
          <span>Delivery</span>
          <strong id="delivery">PHP 0</strong>
        </div>
        <div class="summary-line grand-total">
          <span>Total</span>
          <strong id="grandTotal">PHP 0</strong>
        </div>
        <a class="solid-button" href="index.html#checkout">Proceed to Order</a>
        <button class="line-button" type="button" onclick="clearCart()">Clear Cart</button>
        <a class="line-button" href="index.html#collection">Continue Shopping</a>
      </aside>
    </section>
  </main>

  <script>
    const currency = new Intl.NumberFormat("en-PH", {
      style: "currency",
      currency: "PHP",
      maximumFractionDigits: 0
    });

    let cart = loadCart();

    function loadCart() {
      const savedCart = JSON.parse(localStorage.getItem("andreaCart")) || [];
      if (savedCart.length) return savedCart;

      const oldCart = JSON.parse(localStorage.getItem("cart")) || [];
      if (!oldCart.length) return [];

      const migratedCart = oldCart.reduce((items, oldItem) => {
        const id = Number((oldItem.image || "").replace(".jpg", ""));
        if (!id) return items;

        const existing = items.find((item) => item.id === id);
        if (existing) {
          existing.quantity += 1;
        } else {
          items.push({
            id,
            title: oldItem.title || `Product ${id}`,
            image: oldItem.image,
            description: oldItem.description || "Selected Andrea Studio item.",
            price: Number(oldItem.price) || 0,
            quantity: 1
          });
        }

        return items;
      }, []);

      localStorage.setItem("andreaCart", JSON.stringify(migratedCart));
      localStorage.removeItem("cart");
      return migratedCart;
    }

    function formatMoney(value) {
      return currency.format(value).replace("PHP", "PHP ");
    }

    function saveCart() {
      localStorage.setItem("andreaCart", JSON.stringify(cart));
    }

    function getCartTotals() {
      const items = cart.reduce((sum, item) => sum + item.quantity, 0);
      const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      const delivery = subtotal > 0 ? 120 : 0;
      return { items, subtotal, delivery, total: subtotal + delivery };
    }

    function updateQuantity(productId, change) {
      const item = cart.find((cartItem) => cartItem.id === productId);
      if (!item) return;

      item.quantity += change;
      if (item.quantity <= 0) {
        cart = cart.filter((cartItem) => cartItem.id !== productId);
      }

      saveCart();
      renderCart();
    }

    function removeItem(productId) {
      cart = cart.filter((cartItem) => cartItem.id !== productId);
      saveCart();
      renderCart();
    }

    function clearCart() {
      cart = [];
      localStorage.removeItem("andreaCart");
      renderCart();
    }

    function renderCart() {
      const cartList = document.getElementById("cartList");
      const totals = getCartTotals();

      document.getElementById("itemCount").textContent = `${totals.items} ${totals.items === 1 ? "item" : "items"}`;
      document.getElementById("subtotal").textContent = formatMoney(totals.subtotal);
      document.getElementById("delivery").textContent = formatMoney(totals.delivery);
      document.getElementById("grandTotal").textContent = formatMoney(totals.total);

      if (!cart.length) {
        cartList.innerHTML = '<div class="empty">Your cart is empty. Add products from the collection to begin an order.</div>';
        return;
      }

      cartList.innerHTML = cart.map((item) => `
        <article class="cart-item">
          <img class="cart-thumb" src="${item.image}" alt="${item.title}">
          <div>
            <h3>${item.title}</h3>
            <p>${item.description}</p>
            <div class="cart-row">
              <strong>${formatMoney(item.price * item.quantity)}</strong>
              <div class="qty" aria-label="Quantity controls for ${item.title}">
                <button type="button" onclick="updateQuantity(${item.id}, -1)">-</button>
                <span>${item.quantity}</span>
                <button type="button" onclick="updateQuantity(${item.id}, 1)">+</button>
              </div>
            </div>
            <div class="cart-row">
              <span>${formatMoney(item.price)} each</span>
              <button class="remove" type="button" onclick="removeItem(${item.id})">Remove</button>
            </div>
          </div>
        </article>
      `).join("");
    }

    renderCart();
  </script>
</body>
</html>
