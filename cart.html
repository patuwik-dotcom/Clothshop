<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f5f7fa;
    }

    .cart-container {
      max-width: 900px;
      margin: 50px auto;
    }

    .cart-card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      margin-bottom: 15px;
      transition: 0.2s;
    }

    .cart-card:hover {
      transform: scale(1.01);
    }

    .price {
      font-weight: bold;
      color: #198754;
    }

    .cart-header {
      background: linear-gradient(45deg, #0d6efd, #6610f2);
      color: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
    }

    .total-box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      text-align: center;
      margin-top: 20px;
    }

    .btn-clear {
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container cart-container">

  <div class="cart-header">
    <h2>🛒 My Cart</h2>
  </div>

  <div id="cartList" class="mt-4"></div>

  <div class="total-box">
    <h4 id="total">Total: ₱0</h4>
    <button class="btn btn-danger btn-clear" onclick="clearCart()">Clear Cart</button>
    <a href="index.html" class="btn btn-primary btn-clear">Continue Shopping</a>
  </div>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let cartList = document.getElementById("cartList");
let total = 0;

if (cart.length === 0) {
  cartList.innerHTML = "<p class='text-center text-muted'>Your cart is empty 😢</p>";
}

cart.forEach((item, index) => {
  total += item.price;

  cartList.innerHTML += `
    <div class="card cart-card p-3">
      <div class="row align-items-center">
        
        <div class="col-md-3">
          <img src="${item.image}" class="img-fluid rounded">
        </div>

        <div class="col-md-6">
          <h5>${item.title}</h5>
          <p class="text-muted">${item.description}</p>
        </div>

        <div class="col-md-3 text-end">
          <p class="price">₱${item.price}</p>
        </div>

      </div>
    </div>
  `;
});

document.getElementById("total").innerText = "Total: ₱" + total;

function clearCart() {
  localStorage.removeItem("cart");
  location.reload();
}
</script>

</body>
</html>
